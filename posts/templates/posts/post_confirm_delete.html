{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">

<h3>本当に削除しますか？</h3>
<p>{{ object.content }}</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">削除する</button>
  <a href="{% url 'post_detail' object.pk %}" class="btn btn-secondary">キャンセル</a>
</form>

</div>
{% endblock %}
