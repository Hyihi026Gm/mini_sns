{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}新規登録{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-4 text-center">新規登録</h3>

        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}         

          <button class="btn btn-success w-100">登録する</button>
        </form>

        <hr>

        <div class="text-center">
          <a href="{% url 'login' %}">すでにアカウントをお持ちの方はこちら</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
